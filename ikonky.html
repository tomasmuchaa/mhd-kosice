<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalóg & Galéria SVG ikoniek vozidiel • MHD Košice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.4);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-yellow: #facc15;
      --accent-green: #22c55e;
      --accent-orange: #f97316;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.6) 0px, transparent 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Hlavička */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-icon {
      font-size: 2.2rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.2);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f1f5f9;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .nav-btn.primary {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .nav-btn.primary:hover {
      background: rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
    }

    /* Interaktívny ovládací panel */
    .controls-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .controls-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .line-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      width: 72px;
      text-align: center;
      outline: none;
      transition: all 0.2s;
    }

    .line-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .delay-pills {
      display: flex;
      gap: 6px;
    }

    .delay-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .delay-pill:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .delay-pill.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .search-input-box {
      position: relative;
      min-width: 220px;
    }

    .search-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 7px 12px 7px 32px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Kategórie filter */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .filter-btn.active {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #0f172a;
      box-shadow: 0 2px 12px rgba(56, 189, 248, 0.35);
    }

    .filter-count {
      background: rgba(0, 0, 0, 0.2);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 0.72rem;
    }

    /* Grid modelov */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .model-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .model-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .model-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .model-tag {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }

    .tag-tram { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .tag-articulated { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .tag-standard { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .tag-electric { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .tag-cng { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.3); }
    .tag-midibus { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .tag-historic { background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }

    /* Náhľad ikony */
    .icon-stage {
      background: radial-gradient(circle at center, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      position: relative;
    }

    .icon-render-box {
      transform: scale(1.6);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    }

    .model-card:hover .icon-render-box {
      transform: scale(1.85);
    }

    .icon-dim-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      color: #64748b;
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .model-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .model-subtitle {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .model-desc-box {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.74rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 14px;
      flex-grow: 1;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .model-features {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .model-features li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .feature-bullet {
      color: #38bdf8;
      font-size: 0.8rem;
      line-height: 1.2;
    }

    .model-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-copy-svg {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-copy-svg:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }

    .toast-msg.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Responzivita */
    @media (max-width: 640px) {
      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }
      .controls-left {
        width: 100%;
      }
      .search-input-box {
        width: 100%;
      }
      .models-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Hlavička -->
    <header>
      <div class="header-title-box">
        <div class="header-icon">🎨</div>
        <div>
          <h1>Katalóg & Galéria SVG ikoniek</h1>
          <div class="subtitle">Unikátne čelné zobrazenia vozidiel MHD Košice (DPMK) v reálnom štýle</div>
        </div>
      </div>
      <div class="header-actions">
        <a href="/mapa" class="nav-btn primary">
          <span>📍</span>
          <span>Späť na Živú mapu</span>
        </a>
      </div>
    </header>

    <!-- Interaktívne ovládacie prvky -->
    <div class="controls-panel">
      <div class="controls-left">
        <!-- Číslo linky -->
        <div class="control-group">
          <span class="control-label">Test linky:</span>
          <input type="text" id="global-line-input" class="line-input" value="19" maxlength="4" placeholder="19" oninput="updateAllIcons()" title="Zadajte číslo alebo označenie linky pre dynamické prekreslenie na sklách vozidiel" />
        </div>

        <!-- Meškanie (Delay bar) -->
        <div class="control-group">
          <span class="control-label">Meškanie:</span>
          <div class="delay-pills">
            <button class="delay-pill active" data-delay="0" onclick="setDelaySim(0, this)">0 min (OK)</button>
            <button class="delay-pill" data-delay="2" onclick="setDelaySim(2, this)" style="border-left: 3px solid #facc15;">+2 min</button>
            <button class="delay-pill" data-delay="4" onclick="setDelaySim(4, this)" style="border-left: 3px solid #f97316;">+4 min</button>
            <button class="delay-pill" data-delay="8" onclick="setDelaySim(8, this)" style="border-left: 3px solid #ef4444;">+8 min</button>
          </div>
        </div>
      </div>

      <!-- Vyhľadávanie modelu -->
      <div class="search-input-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="model-search" class="search-input" placeholder="Hľadať model (napr. SOR, Solaris, KT8...)" oninput="filterModels()" />
      </div>
    </div>

    <!-- Kategórie filtre -->
    <div class="filter-bar">
      <button class="filter-btn active" data-cat="all" onclick="setCategoryFilter('all', this)">
        <span>Všetky modely</span>
        <span class="filter-count" id="count-all">22</span>
      </button>
      <button class="filter-btn" data-cat="tram" onclick="setCategoryFilter('tram', this)">
        <span>🚋 Električky</span>
        <span class="filter-count" id="count-tram">4</span>
      </button>
      <button class="filter-btn" data-cat="articulated" onclick="setCategoryFilter('articulated', this)">
        <span>🚌 Kĺbové (18m)</span>
        <span class="filter-count" id="count-articulated">6</span>
      </button>
      <button class="filter-btn" data-cat="standard" onclick="setCategoryFilter('standard', this)">
        <span>🚍 Štandardné (12-15m)</span>
        <span class="filter-count" id="count-standard">7</span>
      </button>
      <button class="filter-btn" data-cat="electric-cng" onclick="setCategoryFilter('electric-cng', this)">
        <span>⚡ Elektro & CNG</span>
        <span class="filter-count" id="count-electric-cng">5</span>
      </button>
      <button class="filter-btn" data-cat="midibus" onclick="setCategoryFilter('midibus', this)">
        <span>🚐 Minibusy</span>
        <span class="filter-count" id="count-midibus">3</span>
      </button>
      <button class="filter-btn" data-cat="historic" onclick="setCategoryFilter('historic', this)">
        <span>🏛️ Historické</span>
        <span class="filter-count" id="count-historic">2</span>
      </button>
    </div>

    <!-- Mriežka kariet modelov -->
    <div id="models-grid" class="models-grid">
      <!-- Generuje sa dynamicky cez JS -->
    </div>
  </div>

  <div id="toast" class="toast-msg">SVG kód skopírovaný do schránky! ✅</div>

  <script>
    // Pomocné funkcie pre renderovanie SVG identické s mapa.html
    function getLineFontSize(lineStr) {
      const len = String(lineStr || '').length;
      if (len <= 2) return 16;
      if (len === 3) return 13;
      return 10.5;
    }

    function getDelayBarColor(delayMinutes) {
      if (typeof delayMinutes === 'string' && ['#facc15', '#f97316', '#ef4444', 'transparent'].includes(delayMinutes)) {
        return delayMinutes;
      }
      const delay = (delayMinutes !== undefined && delayMinutes !== null) ? Number(delayMinutes) : 0;
      if (isNaN(delay) || delay <= 0) return 'transparent';
      if (delay <= 3) return '#facc15';
      if (delay <= 5) return '#f97316';
      return '#ef4444';
    }

    function escapeXml(str) {
      return String(str || '?').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 1. Vario LF2+ / Vario LF (Pragoimex) - DPMK 3-farebná livery (žltá-biela-azúrová), číslo 826, vysoký polopantograf, halogény
    function renderVarioLfSvg(line, delayColorOrMinutes = '', evNum = '826') {
      const safeLine = escapeXml(line || '19');
      const displayEv = escapeXml(String(evNum || '826').trim() || '826');
      const len = safeLine.length;
      const fontSize = len <= 1 ? 15 : (len === 2 ? 13.5 : (len === 3 ? 11 : 9));

      // Štandardná logika meškania aplikovaná na horný displej/panel:
      // 0 minút: neutrálna tmavá (#18181b), do 3 minút: žltá (#facc15), 3 až 5 minút: oranžová (#f97316), viac ako 5 minút: červená (#ef4444)
      const delayColor = getDelayBarColor(delayColorOrMinutes);
      const isDelayed = (delayColor && delayColor !== 'transparent');
      const panelFill = isDelayed ? delayColor : '#18181b';
      const panelStroke = isDelayed ? '#1e2433' : '#27272a';

      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 58" width="46" height="58" class="veh-front-svg veh-vario-lf">
        <defs>
          <filter id="vario-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.35"/>
          </filter>
        </defs>

        <!-- KOĽAJOVÉ KOLESÁ / PODVOZOK (drobné pod nárazníkom) -->
        <g fill="#1e2433" stroke="#111827" stroke-width="0.8">
          <rect x="11.5" y="51.5" width="3.5" height="4.5" rx="1"/>
          <rect x="31" y="51.5" width="3.5" height="4.5" rx="1"/>
        </g>

        <!-- SPÄTNÉ ZRKADLÁ (boky) -->
        <g fill="#242b3d" stroke="#111827" stroke-width="1">
          <rect x="4" y="22.5" width="3" height="8" rx="1.3"/>
          <path d="M 6.5 25.5 L 9 25.5" stroke="#1e2433" stroke-width="1.4" stroke-linecap="round"/>
          <rect x="39" y="22.5" width="3" height="8" rx="1.3"/>
          <path d="M 37 25.5 L 39.5 25.5" stroke="#1e2433" stroke-width="1.4" stroke-linecap="round"/>
        </g>

        <!-- ELEGANTNÝ KOMPAKTNÝ POLOPANTOGRAF (kovová konštrukcia #475569, tenké línie, pevná pätka) -->
        <g stroke-linejoin="round" stroke-linecap="round">
          <!-- Pevná tmavá základňa na streche -->
          <rect x="20" y="15.8" width="6" height="1.4" rx="0.4" fill="#1e293b" stroke="#334155" stroke-width="0.4"/>
          <circle cx="21" cy="15.8" r="0.5" fill="#475569"/>
          <circle cx="25" cy="15.8" r="0.5" fill="#475569"/>

          <!-- Tenké kovové rameno a kĺb -->
          <line x1="22" y1="15.8" x2="23" y2="12.5" stroke="#475569" stroke-width="1.1"/>
          <circle cx="23" cy="12.5" r="0.6" fill="#1e293b" stroke="#64748b" stroke-width="0.3"/>

          <!-- Kosoštvorcové / trojuholníkové horné vahadlo -->
          <polygon points="23,12.5 19.5,8.5 26.5,8.5" fill="none" stroke="#475569" stroke-width="1.0"/>
          <line x1="23" y1="8.5" x2="23" y2="7.0" stroke="#475569" stroke-width="1.0"/>

          <!-- Kompaktná zberacia lišta (šírka 13px, 45% šírky strechy) -->
          <line x1="16.5" y1="7.0" x2="29.5" y2="7.0" stroke="#334155" stroke-width="1.1"/>
          <path d="M 16.5 7.0 L 15.5 7.8 M 29.5 7.0 L 30.5 7.8" stroke="#475569" stroke-width="0.8"/>
        </g>

        <!-- HLAVNÁ KAROSÉRIA (Vario LF2+) S KONTRASTNÝM TMAVÝM OLEMOVANÍM -->

    let currentDelay = 0;
    let currentCategory = 'all';

    function renderModels() {
      const grid = document.getElementById('models-grid');
      const line = document.getElementById('global-line-input').value.trim() || '19';
      const search = (document.getElementById('model-search').value || '').toLowerCase().trim();

      const filtered = VEHICLE_MODELS.filter(m => {
        // Kategória
        if (currentCategory !== 'all') {
          if (currentCategory === 'electric-cng') {
            if (m.category !== 'electric-cng' && !m.tagClass.includes('cng') && !m.tagClass.includes('electric')) return false;
          } else if (m.category !== currentCategory) {
            return false;
          }
        }
        // Hľadanie textu
        if (search) {
          const matchName = m.name.toLowerCase().includes(search);
          const matchSub = m.sub.toLowerCase().includes(search);
          const matchTag = m.tagText.toLowerCase().includes(search);
          const matchFeat = m.features.some(f => f.toLowerCase().includes(search));
          if (!matchName && !matchSub && !matchTag && !matchFeat) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 50px 20px; color: #94a3b8;">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">🔍</div>
            <div style="font-size: 1.1rem; font-weight: 700; color: #f8fafc;">Žiadny model nezodpovedá filtru</div>
            <div style="font-size: 0.85rem; margin-top: 6px;">Skúste zmeniť text vyhľadávania alebo vybrať inú kategóriu.</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const svgContent = m.render(line, currentDelay);
        return `
          <div class="model-card" id="card-${m.id}">
            <div class="model-card-header">
              <span class="model-tag ${m.tagClass}">${m.tagText}</span>
              <span style="font-size: 0.7rem; color: #64748b; font-family: 'JetBrains Mono', monospace;">#${m.id}</span>
            </div>

            <div class="icon-stage">
              <div class="icon-render-box" id="svg-box-${m.id}">
                ${svgContent}
              </div>
              <span class="icon-dim-badge">${m.dimensions}</span>
            </div>

            <div class="model-title">${m.name}</div>
            <div class="model-subtitle">${m.sub}</div>

            <div class="model-desc-box">
              <ul class="model-features">
                ${m.features.map(f => `
                  <li>
                    <span class="feature-bullet">▸</span>
                    <span>${f}</span>
                  </li>
                `).join('')}
              </ul>
            </div>

            <div class="model-card-footer">
              <button class="btn-copy-svg" onclick="copySvgCode('${m.id}')" title="Kopírovať SVG kód tohto modelu">
                <span>📋</span>
                <span>Kopírovať SVG</span>
              </button>
              <a href="/mapa" class="btn-copy-svg" style="text-decoration: none;" title="Zobraziť na živej mape">
                <span>📍 Na mapu →</span>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateAllIcons() {
      renderModels();
    }

    function setDelaySim(delayVal, btn) {
      currentDelay = delayVal;
      document.querySelectorAll('.delay-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderModels();
    }

    function setCategoryFilter(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderModels();
    }

    function filterModels() {
      renderModels();
    }

    function copySvgCode(modelId) {
      const box = document.getElementById(`svg-box-${modelId}`);
      if (!box) return;
      const svg = box.querySelector('svg');
      if (!svg) return;
      const serializer = new XMLSerializer();
      const str = serializer.serializeToString(svg);

      navigator.clipboard.writeText(str).then(() => {
        showToast('SVG kód skopírovaný do schránky! ✅');
      }).catch(() => {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = str;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('SVG kód skopírovaný do schránky! ✅');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Inicializácia pri načítaní
    window.addEventListener('DOMContentLoaded', () => {
      renderModels();
    });
  </script>
